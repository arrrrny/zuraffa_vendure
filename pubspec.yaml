name: vendure
description: The Zuraffa reimplementation of the Vendure Flutter SDK — the GraphQL commerce seam (auth, orders, catalog, customers, system, custom operations) on the zfa clean-architecture stack.
version: 7.3.5
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_vendure
issue_tracker: https://github.com/arrrrny/zuraffa_vendure/issues
topics:
  - vendure
  - commerce
  - graphql
  - flutter

environment:
  sdk: ^3.13.1

dependencies:
  get_it: ^9.3.0
  graphql: ^5.2.4
  json_annotation: ^4.12.0
  zorphy_annotation: ^2.0.0
  zuraffa: ^7.3.2

dev_dependencies:
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
  lints: ^6.0.0
  test: ^1.24.0

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0
